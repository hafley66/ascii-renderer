<!doctype html><meta charset="utf-8"><title>maha viewer</title>
<style>
body{background:#1b1210;color:#f3d9c8;font-family:sans-serif;margin:12px}
#row{display:flex;gap:12px;align-items:flex-start;cursor:grab;user-select:none}
canvas{display:block}
pre{margin:0;width:480px;height:600px;background:#2a1a16;font:10px/10px Menlo,monospace;overflow:hidden;color:#ffd7b0}
button{background:#2a1a16;color:#f3d9c8;border:1px solid #6b2a1c;padding:4px 10px;margin:0 4px 8px 0;cursor:pointer}
button.on{background:#6b2a1c}
</style>
<div id="bar"></div>
<div id="row"><div id="clay"></div><div id="wire"></div><div id="cont"></div><pre id="ascii"></pre></div>
<p>drag: orbit / scroll: zoom / right-drag: pan</p>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';

const KEYS = __KEYS__;
const W = 480, H = 600, COLS = 80, ROWS = 60;
const camera = new THREE.PerspectiveCamera(32, W / H, 0.1, 200);
camera.position.set(0, 9.8, 29);
const mk = (id, bg) => {
  const r = new THREE.WebGLRenderer({antialias: true});
  r.setPixelRatio(devicePixelRatio); r.setSize(W, H); r.setClearColor(bg);
  document.getElementById(id).appendChild(r.domElement); return r;
};
const rWire = mk('wire', 0x140b0a), rCont = mk('cont', 0xe9a890);
const controls = new OrbitControls(camera, document.getElementById('row'));
// ?yaw=deg&dist=&ty= orbit, distance and target height (for scripted screenshots).
const q = new URLSearchParams(location.search);
const yaw0 = +(q.get('yaw') || 0) * Math.PI / 180, dist = +(q.get('dist') || 29), ty = +(q.get('ty') || 6.2);
controls.target.set(0, ty, 0);
camera.position.set(Math.sin(yaw0) * dist, ty + 3.6 * dist / 29, Math.cos(yaw0) * dist);
controls.update();
const wireScene = new THREE.Scene(), contScene = new THREE.Scene();
// Clay: lit sculpt read. Low warm key, cold rim from behind, dim fill.
const rClay = mk('clay', 0x0d0908), clayScene = new THREE.Scene();
rClay.toneMapping = THREE.ACESFilmicToneMapping;
clayScene.add(new THREE.HemisphereLight(0x40302a, 0x080404, 0.6));
const key = new THREE.DirectionalLight(0xffd2a8, 2.6); key.position.set(-6, 4, 10); clayScene.add(key);
const rim = new THREE.DirectionalLight(0x9fc4ff, 3.2); rim.position.set(7, 9, -12); clayScene.add(rim);
const top = new THREE.DirectionalLight(0xffffff, 0.8); top.position.set(0, 20, 2); clayScene.add(top);
const clayMat = new THREE.MeshStandardMaterial({color: 0xe8e0d4, roughness: 0.55, metalness: 0.0, side: THREE.DoubleSide});
const propMat = {
  wing: new THREE.MeshStandardMaterial({color: 0xe8e0d4, roughness: 0.6, side: THREE.DoubleSide, flatShading: true}),
  wheel: new THREE.MeshStandardMaterial({color: 0xb8893a, roughness: 0.35, metalness: 0.8, flatShading: true}),
  blade: new THREE.MeshStandardMaterial({color: 0x9aa0a8, roughness: 0.25, metalness: 0.9, side: THREE.DoubleSide, flatShading: true}),
};
const clothMat = new THREE.MeshStandardMaterial({color: 0x2a2a30, roughness: 0.9, side: THREE.DoubleSide});
const composer = new EffectComposer(rWire);
composer.addPass(new RenderPass(wireScene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.8, 0.4, 0.05));

// Surface nets winding is not guaranteed; flip triangles whose face normal disagrees with the SDF gradient.
function orient(k) {
  const idx = k.idx.slice(), P = k.pos, N = k.nrm;
  const v = i => new THREE.Vector3(P[3*i], P[3*i+1], P[3*i+2]);
  let votes = 0;
  for (let t = 0; t < idx.length; t += 3) {
    const [a, b, c] = [idx[t], idx[t+1], idx[t+2]];
    const f = v(b).sub(v(a)).cross(v(c).sub(v(a)));
    votes += Math.sign(f.x*N[3*a] + f.y*N[3*a+1] + f.z*N[3*a+2]);
  }
  if (votes < 0) for (let t = 0; t < idx.length; t += 3) [idx[t+1], idx[t+2]] = [idx[t+2], idx[t+1]];
  return idx;
}

// Ink seams: where neighbouring vertices belong to different muscles, join the edge midpoints
// (anime line art draws the borders between muscles, not shading). Only in valleys: ?crease= sets
// how deep the fillet must be, so colinear bone capsules along a limb get no ring cut. Nudged out along the normal.
const inkMat = new THREE.LineBasicMaterial({color: 0x5a1a10});
const INK_CREASE = +(q.get('crease') || 1.2);
function seamSegments(idx, P, N, owner, crease) {
  const out = [];
  const mid = (a, b) => new THREE.Vector3(
    (P[3*a] + P[3*b]) / 2 + (N[3*a] + N[3*b]) * 0.02,
    (P[3*a+1] + P[3*b+1]) / 2 + (N[3*a+1] + N[3*b+1]) * 0.02,
    (P[3*a+2] + P[3*b+2]) / 2 + (N[3*a+2] + N[3*b+2]) * 0.02);
  for (let t = 0; t < idx.length; t += 3) {
    const v = [idx[t], idx[t+1], idx[t+2]];
    const cut = [[0, 1], [1, 2], [2, 0]].filter(([i, j]) => owner[v[i]] !== owner[v[j]] && crease[v[i]] + crease[v[j]] > 2 * INK_CREASE).map(([i, j]) => mid(v[i], v[j]));
    if (cut.length === 2) out.push(cut[0], cut[1]);
    if (cut.length === 3) {
      const c = cut[0].clone().add(cut[1]).add(cut[2]).divideScalar(3);
      for (const m of cut) out.push(m, c);
    }
  }
  return out;
}

const built = KEYS.map(k => {
  const idx = orient(k);
  const pos = new Float32Array(k.pos), nrm = new Float32Array(k.nrm);
  const body = [], skirt = [];
  for (let i = 0; i < idx.length; i += 3) {
    const [a, b, c] = [idx[i], idx[i+1], idx[i+2]];
    (k.kind[a] && k.kind[b] && k.kind[c] ? skirt : body).push(a, b, c);
  }
  const geo = ix => {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('normal', new THREE.BufferAttribute(nrm, 3));
    g.setIndex(ix); return g;
  };
  const all = geo(idx);
  const wire = new THREE.Group(), cont = new THREE.Group(), clay = new THREE.Group();
  clay.add(new THREE.Mesh(geo(body), clayMat), new THREE.Mesh(geo(skirt), clothMat));
  const seams = new THREE.BufferGeometry().setFromPoints(seamSegments(idx, pos, nrm, k.owner, k.crease));
  clay.add(new THREE.LineSegments(seams, inkMat));
  cont.add(new THREE.LineSegments(seams, inkMat));
  wire.add(new THREE.Mesh(all, new THREE.MeshBasicMaterial({color: 0x140b0a, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1})));
  for (const [ix, color] of [[body, 0xffc89a], [skirt, 0x7fb8a6]]) {
    const wg = new THREE.WireframeGeometry(geo(ix));
    wire.add(new THREE.LineSegments(wg, new THREE.LineBasicMaterial({color})));
    wire.add(new THREE.LineSegments(wg, new THREE.LineBasicMaterial({color, transparent: true, opacity: 0.07, depthTest: false})));
  }
  cont.add(new THREE.Mesh(all, new THREE.MeshBasicMaterial({color: 0xfbf1e8, side: THREE.DoubleSide})));
  const hull = new Float32Array(pos);
  for (let i = 0; i < hull.length; i++) hull[i] += nrm[i] * 0.07;
  const hg = new THREE.BufferGeometry();
  hg.setAttribute('position', new THREE.BufferAttribute(hull, 3)); hg.setIndex(idx);
  cont.add(new THREE.Mesh(hg, new THREE.MeshBasicMaterial({color: 0x3a140e, side: THREE.BackSide})));
  for (const l of k.lines) {
    const g = new THREE.BufferGeometry().setFromPoints(l.pts.map(q => new THREE.Vector3(...q)));
    wire.add(new THREE.Line(g, new THREE.LineBasicMaterial({color: l.kind === 'wheel' ? 0xf0b848 : 0xdfe8f0})));
    cont.add(new THREE.Line(g, new THREE.LineBasicMaterial({color: l.kind === 'wheel' ? 0x8a5a10 : 0x3a140e})));
  }
  for (const pr of k.props) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pr.tri), 3));
    g.computeVertexNormals();
    clay.add(new THREE.Mesh(g, propMat[pr.kind]));
    cont.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({color: pr.kind === 'wheel' ? 0xc89040 : 0xfbf1e8, side: THREE.DoubleSide})));
    cont.add(new THREE.LineSegments(new THREE.EdgesGeometry(g, 40), inkMat));
    wire.add(new THREE.LineSegments(new THREE.WireframeGeometry(g), new THREE.LineBasicMaterial({color: pr.kind === 'wheel' ? 0xf0b848 : 0xdfe8f0})));
  }
  wireScene.add(wire); contScene.add(cont); clayScene.add(clay);
  return {wire, cont, clay};
});

let cur = 0, playing = false, last = 0;
const bar = document.getElementById('bar');
const cycle = KEYS.map((k, i) => k.cycle ? i : -1).filter(i => i >= 0);
const buttons = KEYS.map((k, i) => {
  if (k.cycle) return null;
  const b = document.createElement('button'); b.textContent = k.name;
  b.onclick = () => { setPlaying(false); show(i); };
  bar.appendChild(b); return b;
});
const play = document.createElement('button'); play.textContent = 'walk'; bar.appendChild(play);
const speed = document.createElement('input'); speed.type = 'range'; speed.min = 30; speed.max = 300; speed.value = 90;
bar.append(' frame ms ', speed);
function setPlaying(on) { playing = on; play.classList.toggle('on', on); }
play.onclick = () => setPlaying(!playing);
let step = 0;
function show(i) {
  cur = i;
  built.forEach((b, j) => { b.wire.visible = b.cont.visible = b.clay.visible = j === i; buttons[j]?.classList.toggle('on', j === i); });
}
show(0);

// ASCII: render the contour view tiny, one pixel per cell; edge cells get a glyph from the mask gradient.
const rt = new THREE.WebGLRenderTarget(COLS, ROWS);
const px = new Uint8Array(COLS * ROWS * 4);
const pre = document.getElementById('ascii');
function ascii() {
  rCont.setRenderTarget(rt); rCont.render(contScene, camera); rCont.setRenderTarget(null);
  rCont.readRenderTargetPixels(rt, 0, 0, COLS, ROWS, px);
  const at = (x, y) => ((ROWS - 1 - y) * COLS + x) * 4;
  const ink = (x, y) => { const i = at(x, y); return px[i] + px[i+1] + px[i+2] < 200; };
  const inside = (x, y) => {
    if (x < 0 || y < 0 || x >= COLS || y >= ROWS) return 0;
    const i = at(x, y); return px[i+1] > 200 || ink(x, y) ? 1 : 0;
  };
  let out = '';
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      if (!inside(x, y)) { out += ' '; continue; }
      const gx = inside(x+1, y-1) + 2*inside(x+1, y) + inside(x+1, y+1) - inside(x-1, y-1) - 2*inside(x-1, y) - inside(x-1, y+1);
      const gy = inside(x-1, y+1) + 2*inside(x, y+1) + inside(x+1, y+1) - inside(x-1, y-1) - 2*inside(x, y-1) - inside(x+1, y-1);
      if (gx || gy) {
        const ax = Math.abs(gx), ay = Math.abs(gy);
        out += ax > 2*ay ? '|' : ay > 2*ax ? '-' : gx*gy > 0 ? '/' : '\\';
      } else out += ink(x, y) ? ':' : ' ';
    }
    out += '\n';
  }
  pre.textContent = out;
}

function frame(t) {
  requestAnimationFrame(frame);
  if (playing && t - last > +speed.value) { last = t; step = (step + 1) % cycle.length; show(cycle[step]); }
  controls.update();
  composer.render();
  rClay.render(clayScene, camera);
  rCont.render(contScene, camera);
  ascii();
}
requestAnimationFrame(frame);
</script>
