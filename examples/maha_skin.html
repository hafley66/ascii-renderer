<!doctype html><meta charset="utf-8"><title>maha skinned walk</title>
<style>
body{background:#1b1210;color:#f3d9c8;font-family:sans-serif;margin:0;display:flex;height:100vh;overflow:hidden}
main{flex:1;overflow:auto;padding:12px}
aside{width:310px;flex:none;overflow-y:auto;padding:10px;border-left:1px solid #3a2420;background:#1f1411}
aside.closed{width:26px;overflow:hidden;padding:10px 4px}
aside.closed>*:not(#fold){display:none}
details{border-top:1px solid #3a2420;padding:4px 0}
summary{cursor:pointer;color:#c9906f;font-size:12px;padding:2px 0}
div#row{display:flex;gap:12px;align-items:flex-start;cursor:grab;user-select:none}
canvas{display:block}
pre{margin:0;width:480px;height:600px;background:#2a1a16;font:10px/10px Menlo,monospace;overflow:hidden;color:#ffd7b0}
button{background:#2a1a16;color:#f3d9c8;border:1px solid #6b2a1c;padding:4px 10px;margin:0 6px 6px 0;cursor:pointer}
button.on{background:#6b2a1c}
button.preset{border-color:#8a5a10}
div#knobs label{display:grid;grid-template-columns:112px 1fr 40px;align-items:center;gap:6px;font-size:12px;margin:2px 0}
div#knobs input{width:100%}
div.hidden{display:none}
div#knobs label:hover{background:#2e1c17;cursor:help}
div#tip{position:fixed;z-index:10;width:260px;padding:6px 8px;background:#2a1a16;border:1px solid #8a5a10;color:#f3d9c8;font-size:12px;line-height:1.35;white-space:pre-line;pointer-events:none}
p.hint{font-size:11px;color:#a87a62;margin:4px 0 8px}
div#knobs label.sweeping{background:#4a2018;outline:1px solid #f0b848}
</style>
<main>
<div id="bar"></div>
<div id="row"><div id="wire"></div><div id="cont"></div><div id="asciiBox"><pre id="ascii"></pre></div></div>
<p>drag: orbit / scroll: zoom / right-drag: pan</p>
</main>
<aside id="side"><button id="fold">&raquo;</button>
<p class="hint">hover a knob + press <b>S</b>: it sweeps left then right. click = keep that value. <b>S</b> again or mouse out = snap back.</p>
<details open><summary>walk presets</summary><div id="presets"></div></details>
<details open><summary>body presets</summary><div id="bodyPresets"></div></details>
<div id="knobs"></div>
</aside>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';

const RIG = __RIG__;
const W = 480, H = 600, COLS = 80, ROWS = 60, WIRE = 1, CONT = 2;

// Knobs: [group, key, label, min, max, step, default]. Angles in degrees, lengths in rig units, scales as factors.
const SPEC = [
  ['timing', 'speed', 'cycles / sec', 0, 2, 0.01, 0.55],
  ['timing', 'phase', 'phase (paused)', 0, 1, 0.001, 0],
  ['legs', 'strideRatio', 'stride / leg length', 0, 1.6, 0.01, 1.15],
  ['legs', 'duty', 'stance share', 0.5, 0.8, 0.01, 0.64],
  ['legs', 'liftRatio', 'foot lift / leg', 0, 0.3, 0.005, 0.09],
  ['legs', 'liftSkew', 'lift peaks early', 0.3, 1, 0.01, 0.6],
  ['legs', 'kneeLoad', 'knee give at landing', 0, 35, 0.5, 15],
  ['legs', 'kneeMid', 'knee at midstance', 0, 30, 0.5, 5],
  ['legs', 'autoHeight', 'hips ride legs', 0, 1, 0.05, 1],
  ['legs', 'footOut', 'stance width', -0.6, 0.8, 0.01, -0.05],
  ['legs', 'footLevel', 'foot stays flat', 0, 1, 0.05, 1],
  ['legs', 'heelStrike', 'toe up at landing', 0, 30, 0.5, 12],
  ['legs', 'toeRoll', 'heel peel at push', 0, 50, 0.5, 30],
  ['weight', 'weightShift', 'weight shift', 0, 0.8, 0.01, 0.18],
  ['weight', 'hipDrop', 'hip drop', 0, 15, 0.25, 2.25],
  ['weight', 'counterLean', 'torso counter-lean', 0, 2, 0.05, 1.3],
  ['weight', 'shoulderSway', 'shoulders lean over foot', 0, 6, 0.1, 1.5],
  ['weight', 'bob', 'vertical bob', 0, 0.8, 0.01, 0],
  ['torso', 'pelvisTwist', 'pelvis twist', 0, 25, 0.5, 3],
  ['torso', 'torsoTwist', 'torso twist', 0, 40, 0.5, 6],
  ['torso', 'spineShare', 'twist in spine', 0, 1, 0.05, 0.6],
  ['torso', 'lean', 'forward lean', -10, 20, 0.5, 2],
  ['torso', 'headStab', 'head holds front', 0, 1, 0.05, 0.6],
  ['arms', 'armSwing', 'arm swing', 0, 60, 0.5, 9],
  ['arms', 'armBias', 'swing biased back', -20, 10, 0.5, -6],
  ['arms', 'armCross', 'arm cross in', 0, 30, 0.5, 3],
  ['arms', 'armSpread', 'arm spread', 0, 40, 0.5, 13],
  ['arms', 'elbowRest', 'elbow rest', 0, 60, 0.5, 12],
  ['arms', 'elbowSwing', 'elbow fwd bend', 0, 80, 0.5, 20],
  ['arms', 'wristFlex', 'wrist curl', -30, 50, 0.5, 8],
  ['arms', 'wristLag', 'hand trails swing', 0, 40, 0.5, 10],
  ['traps', 'trapHeight', 'trap height', -1, 2, 0.01, 0],
  ['traps', 'trapMass', 'trap mass', -1.5, 2.5, 0.01, 0],
  ['traps', 'trapReach', 'trap reach', -1.5, 1.5, 0.01, 0],
  ['traps', 'trapSlope', 'trap slope', -1.5, 1.5, 0.01, 0],
  ['shoulders', 'deltMass', 'delt mass', -1.5, 2.5, 0.01, 0],
  ['shoulders', 'deltLength', 'delt length', -1, 2, 0.01, 0],
  ['shoulders', 'deltOut', 'delt bulge out', -1, 2, 0.01, 0],
  ['shoulders', 'deltCap', 'delt cap (ball)', -1, 2.5, 0.01, 0],
  ['proportion', 'shoulderDrop', 'shoulder drop', -0.6, 0.8, 0.01, 0],
  ['proportion', 'shoulderWidth', 'shoulder width', 0.5, 1.9, 0.005, 1],
  ['proportion', 'armLen', 'arm length', 0.7, 1.35, 0.005, 1],
  ['proportion', 'legLen', 'leg length', 0.8, 1.2, 0.005, 1],
  ['proportion', 'torsoLen', 'torso length', 0.85, 1.2, 0.005, 1],
  ['proportion', 'headSize', 'head size', 0.5, 1.8, 0.005, 1],
  ['randomness', 'seed', 'seed', 0, 99, 1, 7],
  ['randomness', 'stepJitter', 'step length jitter', 0, 0.5, 0.005, 0],
  ['randomness', 'footJitter', 'foot placement jitter', 0, 0.5, 0.005, 0],
  ['randomness', 'armVar', 'arm swing variation', 0, 1, 0.01, 0],
  ['randomness', 'bodyDrift', 'body drift', 0, 1, 0.01, 0],
  ['randomness', 'headLook', 'head looks around', 0, 30, 0.25, 0],
  ['domain pressure', 'buffet', 'pushed off line', 0, 2, 0.01, 0],
  ['domain pressure', 'buffetRate', 'push change rate', 0.05, 1.5, 0.01, 0.3],
  ['domain pressure', 'bracing', 'leans into push', 0, 3, 0.05, 0.8],
  ['view', 'camYaw', 'camera angle', -180, 180, 1, 0],
  ['view', 'skirt', 'hakama opacity', 0, 1, 0.01, 0.35],
  ['view', 'outline', 'outline thickness', 0, 0.3, 0.005, 0.07],
  ['view', 'shards', 'outline shards', 0, 0.3, 0.005, 0],
];
const TIPS = {
  speed: 'Walk cycles per second. One cycle = a left step and a right step.',
  phase: 'Where in the cycle the pose sits while walk is paused. 0 = right foot lands.',
  strideRatio: 'How far the body travels per cycle, as a multiple of leg length.',
  duty: 'Share of the cycle each foot spends planted. Above 0.5 means both feet are down for a moment.',
  liftRatio: 'Peak foot height during the swing, as a share of leg length.',
  kneeLoad: 'Knee bend as the foot takes the weight, peaking about 13% into the cycle. Textbook 15-20.',
  kneeMid: 'Knee bend once the body is over the foot. Textbook about 5.',
  liftSkew: 'Shape of the foot lift. Lower = peak earlier in the swing, like a real knee flick.',
  shoulderSway: 'Upper body leans over the planted foot, in degrees. Shoulders carry the sway, not the hips.',
  armBias: 'Shifts the arm swing backward (negative), as real arms swing more back than forward.',
  autoHeight: '1 = hips rise and fall so both feet reach the ground. 0 = hips hold a fixed height.',
  footOut: 'Sideways distance of each foot from the hip line. Wider = more planted, lumbering.',
  footLevel: 'How much the ankle cancels hip and knee so the planted foot stays flat.',
  heelStrike: 'Toe raised as the heel lands, rolling flat by about 15% of the stance.',
  toeRoll: 'Heel peel at push-off, pivoting on the ball of the foot, in degrees. Drives the toe-off knee bend.',
  weightShift: 'Pelvis slides sideways over whichever foot is planted.',
  hipDrop: 'Swing-side hip dips while the other leg carries the weight, in degrees.',
  counterLean: 'Torso tilts against the hip drop to stay balanced. 1 = cancels it.',
  bob: 'Extra up and down on top of the leg-driven rise and fall.',
  pelvisTwist: 'Pelvis turns toward the forward leg, in degrees.',
  torsoTwist: 'Chest turns against the pelvis about the body axis, in degrees.',
  spineShare: 'How much of the torso twist happens low in the spine versus up in the chest.',
  lean: 'Whole upper body tipping forward, in degrees.',
  headStab: 'Head turning against the chest so the face keeps pointing ahead. 1 = fully steady.',
  armSwing: 'Forward/back arm swing, opposite to the legs, in degrees.',
  armCross: 'Forward-swinging arm moves in toward the midline; the back arm flares out.',
  armSpread: 'Arms held out from the body at rest, in degrees.',
  elbowRest: 'Elbow bend at rest, in degrees.',
  elbowSwing: 'Extra elbow bend on the forward swing, in degrees.',
  wristFlex: 'Hand curl at rest, in degrees.',
  wristLag: 'Hand trailing behind the arm swing, in degrees.',
  trapHeight: 'Traps rise up the neck toward the skull. 1 = +0.5 units at the spine end.',
  trapMass: 'Thickness of every trap bundle. 1 = +0.2 radius.',
  trapReach: 'How far out along the collarbone the traps attach. 1 = +0.35.',
  trapSlope: 'Drops the shoulder-side attachment to steepen the slope. 1 = 0.35 lower.',
  deltMass: 'Delt thickness, mostly at the top. 1 = +0.2 radius at the top.',
  deltLength: 'How far the delt runs down the arm. 1 = +0.4.',
  deltOut: 'Delt shifted outward from the shoulder joint. 1 = +0.2.',
  deltCap: 'A ball on the shoulder tip that swells up and out. 1 = +0.14 radius, +0.2 up.',
  shoulderDrop: 'Lowers both shoulder joints. The arms and delts follow.',
  shoulderWidth: 'Multiplies how far the shoulder joints sit from center.',
  armLen: 'Multiplies arm length (upper arm, forearm, hand).',
  legLen: 'Multiplies leg length. The gait rescales with it.',
  torsoLen: 'Multiplies the spine-to-chest distance.',
  headSize: 'Scales the head, wings and wheel.',
  seed: 'Picks which random variation you get. Same seed = same walk every time.',
  stepJitter: 'Each step lands a little longer or shorter, as a share of stride.',
  footJitter: 'Each foot lands a little in or out from its line.',
  armVar: 'Arm swing size changes step to step.',
  bodyDrift: 'Slow wandering of lean, twist and tilt, like a body settling.',
  headLook: 'Head slowly turns and tips to look around, in degrees.',
  buffet: 'Max sideways drift off his straight line, in rig units. Planted feet stay put; each new step lands where the push has carried him.',
  buffetRate: 'How fast the push wanders, per walk cycle. Low = slow shove, high = gusty.',
  bracing: 'Torso leans against the push, scaled by how hard it is shoving right now.',
  camYaw: 'Orbits the camera around him: 0 = front, 90 = his left side, 180 = behind.',
  skirt: 'Hakama see-through amount. 0 hides it and shows the full legs.',
  outline: 'Thickness of the dark outline in the contour view.',
  shards: 'Random extra outline push per vertex: more jagged triangle shards.',
};
const DEFAULTS = Object.fromEntries(SPEC.map(s => [s[1], s[6]]));

// Walk presets touch only walk knobs; body presets only body knobs, so the two mix freely.
const BODY_GROUPS = ['traps', 'shoulders', 'proportion'];
const BODY_KEYS = SPEC.filter(s => BODY_GROUPS.includes(s[0])).map(s => s[1]);
const VIEW_KEYS = SPEC.filter(s => s[0] === 'view').map(s => s[1]);
const WALK_KEYS = SPEC.map(s => s[1]).filter(k => !BODY_KEYS.includes(k) && !VIEW_KEYS.includes(k));
const PRESETS = {
  'taking the domain': {speed: 0.5, armSwing: 18, pelvisTwist: 12, torsoTwist: 8, weightShift: 0.3, hipDrop: 4, headStab: 1, headLook: 0, bodyDrift: 0.15, stepJitter: 0.12, footJitter: 0.08, armVar: 0.3, buffet: 0.6, buffetRate: 0.3, bracing: 0.8},
  'drunk on cursed energy': {weightShift: 0.45, hipDrop: 7, counterLean: 1, torsoTwist: 18, stepJitter: 0.3, footJitter: 0.25, bodyDrift: 0.8, headLook: 10},
  'wading through fire': {speed: 0.4, lean: 8, liftRatio: 0.16, weightShift: 0.25, armSpread: 20, elbowRest: 18},
  'shoulder-led': {torsoTwist: 26, spineShare: 0.3, pelvisTwist: 1, weightShift: 0.12, armSwing: 18},
  'hip-led swagger': {pelvisTwist: 12, weightShift: 0.3, hipDrop: 4, torsoTwist: 8, armSwing: 16},
  'after the adaptation': {speed: 0.5, weightShift: 0.2, hipDrop: 2.5, torsoTwist: 15, bodyDrift: 0.4, headLook: 12},
};
const BODY_PRESETS = {
  'research athlete': {},
  'decathlete': {shoulderWidth: 1.1, deltCap: 0.5, trapMass: 0.4, legLen: 1.05},
  'olympic lifter': {shoulderWidth: 1.2, trapMass: 1.2, trapHeight: 0.8, deltMass: 0.8, deltCap: 0.8, legLen: 0.95, torsoLen: 0.95},
  'long-armed giant': {armLen: 1.25, shoulderWidth: 1.2, deltCap: 0.6, legLen: 1.05},
  'small-headed brute': {headSize: 0.75, trapHeight: 1.3, trapMass: 1.2, shoulderWidth: 1.3, deltCap: 1},
  'titan': {shoulderWidth: 1.35, trapMass: 1.5, trapHeight: 1.2, deltCap: 1.5, deltMass: 1, armLen: 1.1, headSize: 0.85},
  'anime mahoraga': {shoulderWidth: 1.5, deltCap: 1.2, deltMass: 1, trapMass: 1, trapHeight: 1, armLen: 1.15, headSize: 1.1},
};

// Knob state lives in the hash query (#?k=v&...): file:// refuses history writes, location.replace does not.
const K = {...DEFAULTS};
const hashParams = () => new URLSearchParams(location.hash.replace(/^#[^?]*\??/, ''));
for (const [k, v] of hashParams()) if (k in K) K[k] = +v;
let writeTimer = 0;
const diff = () => Object.fromEntries(Object.entries(K).filter(([k, v]) => v !== DEFAULTS[k]));
const persist = () => {
  clearTimeout(writeTimer);
  writeTimer = setTimeout(() => location.replace('#?' + new URLSearchParams(diff())), 150);
};
// Instant tooltip: one fixed box placed left of the hovered row (native title waits ~1s).
const tip = Object.assign(document.createElement('div'), {id: 'tip', hidden: true});
document.body.appendChild(tip);
function showTip(row) {
  const r = row.getBoundingClientRect();
  tip.textContent = row.dataset.tip; tip.hidden = false;
  tip.style.top = `${Math.min(r.top, innerHeight - tip.offsetHeight - 8)}px`;
  tip.style.left = `${r.left - tip.offsetWidth - 10}px`;
}
const knobs = document.getElementById('knobs');
const inputs = {};
const openGroups = JSON.parse(localStorage.getItem('maha-open') || '["timing","weight","arms"]');
const groups = {};
for (const [g, key, label, min, max, step] of SPEC) {
  if (!groups[g]) {
    const d = document.createElement('details');
    d.open = openGroups.includes(g);
    d.ontoggle = () => localStorage.setItem('maha-open', JSON.stringify(Object.keys(groups).filter(n => groups[n].open)));
    d.appendChild(Object.assign(document.createElement('summary'), {textContent: g}));
    knobs.appendChild(d); groups[g] = d;
  }
  const groupEl = groups[g];
  const l = document.createElement('label');
  const input = Object.assign(document.createElement('input'), {type: 'range', min, max, step, value: K[key]});
  const out = document.createElement('span'); out.textContent = K[key];
  input.oninput = () => { K[key] = +input.value; out.textContent = input.value; persist(); };
  inputs[key] = [input, out];
  l.dataset.tip = `${TIPS[key] ?? ''}\nrange ${min} to ${max}. hover + S to sweep.`;
  l.onmouseenter = () => { hovered = key; showTip(l); };
  l.onmouseleave = () => { tip.hidden = true; if (hovered === key) hovered = null; if (sweep?.key === key) stopSweep(true); };
  l.addEventListener('pointerdown', e => { if (sweep?.key === key) { e.preventDefault(); stopSweep(false); } });
  l.append(label, input, out); groupEl.appendChild(l);
}
const side = document.getElementById('side');
document.getElementById('fold').onclick = () => {
  side.classList.toggle('closed');
  document.getElementById('fold').innerHTML = side.classList.contains('closed') ? '&laquo;' : '&raquo;';
};
// Audition: hover a knob, press S. It glides left, then right, around its range.
// Hover out snaps back to where it was; click pins the value it is on.
let hovered = null, sweep = null;
const SWEEP_PERIOD = 3;
function showKnob(key) { inputs[key][0].value = K[key]; inputs[key][1].textContent = (+K[key]).toFixed(3).replace(/\.?0+$/, ''); }
function stopSweep(restore) {
  if (!sweep) return;
  const {key, v0} = sweep;
  inputs[key][0].parentElement.classList.remove('sweeping');
  if (restore) K[key] = v0; else persist();
  showKnob(key); sweep = null;
}
function stepSweep(now) {
  if (!sweep) return;
  const [input] = inputs[sweep.key];
  const lo = +input.min, hi = +input.max, mid = (lo + hi) / 2, half = (hi - lo) / 2;
  const t = (now - sweep.t0) / 1000;
  K[sweep.key] = mid + half * Math.sin(sweep.theta0 - (2 * Math.PI / SWEEP_PERIOD) * t);
  showKnob(sweep.key);
}
addEventListener('keydown', e => {
  if (e.key === 'Escape') return stopSweep(true);
  if (e.key.toLowerCase() !== 's' || e.repeat) return;
  if (sweep) return stopSweep(true);
  if (!hovered) return;
  const [input] = inputs[hovered];
  const lo = +input.min, hi = +input.max, v0 = K[hovered];
  const theta0 = Math.asin(Math.max(-1, Math.min(1, (v0 - (lo + hi) / 2) / ((hi - lo) / 2))));
  sweep = {key: hovered, v0, theta0, t0: performance.now()};
  input.parentElement.classList.add('sweeping');
});

function setKnobs(values, keys = Object.keys(DEFAULTS)) {
  for (const k of keys) K[k] = values[k] ?? DEFAULTS[k];
  for (const k in inputs) { inputs[k][0].value = K[k]; inputs[k][1].textContent = K[k]; }
  persist();
}

const pick = keys => Object.fromEntries(Object.entries(diff()).filter(([k]) => keys.includes(k)));
function drawPresetBar(el, builtIn, storeKey, keys) {
  const saved = () => JSON.parse(localStorage.getItem(storeKey) || '{}');
  const draw = () => {
    el.replaceChildren();
    for (const [name, values] of Object.entries({...builtIn, ...saved()})) {
      const b = Object.assign(document.createElement('button'), {textContent: name, className: 'preset'});
      b.onclick = () => setKnobs(values, keys);
      el.appendChild(b);
    }
    const save = Object.assign(document.createElement('button'), {textContent: '+ save current'});
    save.onclick = () => {
      const name = prompt('preset name');
      if (name) { localStorage.setItem(storeKey, JSON.stringify({...saved(), [name]: pick(keys)})); draw(); }
    };
    el.appendChild(save);
  };
  draw();
}
drawPresetBar(document.getElementById('presets'), PRESETS, 'maha-presets', WALK_KEYS);
drawPresetBar(document.getElementById('bodyPresets'), BODY_PRESETS, 'maha-body-presets', BODY_KEYS);

const camera = new THREE.PerspectiveCamera(32, W / H, 0.1, 200);
camera.position.set(0, 9.8, 29);
const mk = (id, bg) => {
  const r = new THREE.WebGLRenderer({antialias: true});
  r.setPixelRatio(devicePixelRatio); r.setSize(W, H); r.setClearColor(bg);
  document.getElementById(id).appendChild(r.domElement); return r;
};
const rWire = mk('wire', 0x140b0a), rCont = mk('cont', 0xe9a890);
const controls = new OrbitControls(camera, document.getElementById('row'));
controls.target.set(0, 6.2, 0); controls.update();
const scene = new THREE.Scene();
const composer = new EffectComposer(rWire);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.8, 0.4, 0.05));

// Same rotation order as the Rust rig: Ry(yaw) * Rz(side * spread) * Rx(-pitch).
const X = new THREE.Vector3(1, 0, 0), Y = new THREE.Vector3(0, 1, 0), Z = new THREE.Vector3(0, 0, 1), D = Math.PI / 180;
const qa = (axis, deg) => new THREE.Quaternion().setFromAxisAngle(axis, deg * D);
function localRot(name, [pitch, spread, yaw]) {
  const side = name.startsWith('r_') ? -1 : 1;
  return qa(Y, yaw).multiply(qa(Z, side * spread)).multiply(qa(X, -pitch));
}

const bones = RIG.joints.map(j => {
  const b = new THREE.Bone(); b.name = j.name;
  b.position.fromArray(j.offset); b.quaternion.copy(localRot(j.name, j.rest)); return b;
});
RIG.joints.forEach((j, i) => { if (j.parent >= 0) bones[j.parent].add(bones[i]); });
const at = Object.fromEntries(RIG.joints.map((j, i) => [j.name, i]));
// Leg measurements come from the rig itself, so proportion sliders keep the gait consistent.
const THIGH = -RIG.joints[at.r_knee].offset[1], SHIN = -RIG.joints[at.r_ankle].offset[1];
const HIP_Y = RIG.joints[at.pelvis].offset[1] + RIG.joints[at.r_hip].offset[1];
const HIP_X = Math.abs(RIG.joints[at.r_hip].offset[0]);
const GROUND_ANKLE_Y = HIP_Y - THIGH - SHIN;
const legLength = () => (THIGH + SHIN) * K.legLen;
const stride = () => K.strideRatio * legLength();
const skeleton = new THREE.Skeleton(bones);

// Surface nets winding is not guaranteed; flip triangles whose face normal disagrees with the SDF gradient.
function orient(part) {
  const idx = part.idx.slice(), P = part.pos, N = part.nrm;
  const v = i => new THREE.Vector3(P[3*i], P[3*i+1], P[3*i+2]);
  let votes = 0;
  for (let t = 0; t < idx.length; t += 3) {
    const [a, b, c] = [idx[t], idx[t+1], idx[t+2]];
    const f = v(b).sub(v(a)).cross(v(c).sub(v(a)));
    votes += Math.sign(f.x*N[3*a] + f.y*N[3*a+1] + f.z*N[3*a+2]);
  }
  if (votes < 0) for (let t = 0; t < idx.length; t += 3) [idx[t+1], idx[t+2]] = [idx[t+2], idx[t+1]];
  return idx;
}
function partGeo(part, inflate) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(part.pos.map((p, i) => p + part.nrm[i] * inflate)), 3));
  g.setAttribute('normal', new THREE.BufferAttribute(new Float32Array(part.nrm), 3));
  g.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(part.skinIndex, 4));
  g.setAttribute('skinWeight', new THREE.Float32BufferAttribute(part.skinWeight, 4));
  const names = Object.keys(part.morphs ?? {});
  g.morphAttributes.position = names.map(n => new THREE.BufferAttribute(new Float32Array(part.morphs[n]), 3));
  g.morphTargetsRelative = true;
  g.userData.morphNames = names;
  g.setIndex(orient(part)); return g;
}

let first = null;
function skinned(g, material, layer) {
  const m = new THREE.SkinnedMesh(g, material);
  m.frustumCulled = false;
  if (!first) { first = m; m.add(bones[0]); m.bind(skeleton); } else m.bind(skeleton, first.bindMatrix);
  m.layers.set(layer); scene.add(m); return m;
}
const body = partGeo(RIG.body, 0), bodyHull = partGeo(RIG.body, 0.07);
const skirt = partGeo(RIG.skirt, 0), skirtHull = partGeo(RIG.skirt, 0.07);
const bodyMeshes = [
  skinned(body, new THREE.MeshBasicMaterial({color: 0x140b0a, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1}), WIRE),
  skinned(body, new THREE.MeshBasicMaterial({color: 0xffc89a, wireframe: true}), WIRE),
  skinned(body, new THREE.MeshBasicMaterial({color: 0xffc89a, wireframe: true, transparent: true, opacity: 0.07, depthTest: false}), WIRE),
  skinned(body, new THREE.MeshBasicMaterial({color: 0xfbf1e8, side: THREE.DoubleSide}), CONT),
  skinned(bodyHull, new THREE.MeshBasicMaterial({color: 0x3a140e, side: THREE.BackSide}), CONT),
];
const skirtMats = [
  new THREE.MeshBasicMaterial({color: 0x7fb8a6, wireframe: true, transparent: true}),
  new THREE.MeshBasicMaterial({color: 0x44564f, side: THREE.DoubleSide, transparent: true, depthWrite: false}),
  new THREE.MeshBasicMaterial({color: 0x3a140e, side: THREE.BackSide, transparent: true, depthWrite: false}),
];
const skirtMeshes = [skinned(skirt, skirtMats[0], WIRE), skinned(skirt, skirtMats[1], CONT), skinned(skirtHull, skirtMats[2], CONT)];

const bonesView = new THREE.SkeletonHelper(first);
bonesView.layers.enable(WIRE); bonesView.layers.enable(CONT); bonesView.visible = false;
scene.add(bonesView);

// Wheel and blade ride their bones: convert bind-pose world points into bone-local space.
scene.updateMatrixWorld(true);
for (const l of RIG.lines) {
  const bone = bones[l.bone];
  const pts = l.pts.map(q => bone.worldToLocal(new THREE.Vector3(...q)));
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({color: l.kind === 'wheel' ? 0xf0b848 : 0xdfe8f0}));
  line.layers.enable(WIRE); line.layers.enable(CONT); bone.add(line);
}

let clock = 0;
let playing = true, phase = 0, cycles = 0, showRest = false, follow = true;
const ground = new THREE.GridHelper(120, 40, 0x8a3a28, 0x3a2420);
ground.material.transparent = true; ground.material.opacity = 0.45;
ground.position.y = GROUND_ANKLE_Y - 0.45;
ground.layers.enable(WIRE); ground.layers.enable(CONT); scene.add(ground);
const bar = document.getElementById('bar');
const toggle = (label, on, fn) => {
  const b = Object.assign(document.createElement('button'), {textContent: label});
  b.classList.toggle('on', on);
  b.onclick = () => b.classList.toggle('on', fn());
  bar.appendChild(b);
};
toggle('walk', true, () => (playing = !playing));
toggle('bind pose', false, () => (showRest = !showRest));
toggle('bones', false, () => (bonesView.visible = !bonesView.visible));
toggle('camera follows', true, () => (follow = !follow));
for (const [label, id] of [['wire view', 'wire'], ['contour view', 'cont'], ['ascii view', 'asciiBox']]) {
  const el = document.getElementById(id);
  toggle(label, true, () => !el.classList.toggle('hidden'));
}
const resetBtn = Object.assign(document.createElement('button'), {textContent: 'reset knobs'});
resetBtn.onclick = () => setKnobs({}); bar.appendChild(resetBtn);

// Seeded randomness: hash per step index (constant while a foot is planted), smooth wander over time.
const hash = (n, k) => { const x = Math.sin(n * 12.9898 + k * 78.233 + K.seed * 37.719) * 43758.5453; return x - Math.floor(x); };
const wander = (t, k) => 0.6 * Math.sin(t * 1.3 + hash(k, 1) * 6.28) + 0.4 * Math.sin(t * 2.9 + hash(k, 2) * 6.28);
const legCycle = side => (side === 'r' ? cycles : cycles + 0.5);
// Domain pressure: a slow sideways push on his path, as a function of walk cycles.
const pushX = c => K.buffet * (0.7 * wander(c * K.buffetRate * 4, 21) + 0.3 * wander(c * K.buffetRate * 12, 23));
const pushRate = c => (pushX(c + 0.02) - pushX(c - 0.02)) / 0.04;
function stepJitter(side) {
  const lc = legCycle(side), n = Math.floor(lc), u = lc - n;
  const landed = m => (side === 'r' ? m : m - 0.5);
  const at_ = m => ({
    z: K.stepJitter * stride() * (hash(m, side === 'r' ? 3 : 4) - 0.5),
    x: K.footJitter * (hash(m, side === 'r' ? 5 : 6) - 0.5) + pushX(landed(m)) * (side === 'r' ? -1 : 1),
  });
  const j0 = at_(n);
  if (u < K.duty) return j0;
  const j1 = at_(n + 1), v = smooth((u - K.duty) / (1 - K.duty));
  return {z: j0.z + (j1.z - j0.z) * v, x: j0.x + (j1.x - j0.x) * v};
}

// Upper body rides a = 2pi*phase + pi/2, so s = sin(a) = 1 when the right foot lands (phase 0).
// Weight centres over the stance foot; the swing-side hip drops and the torso leans against it.
function walkRots(ph) {
  const a = ph * 2 * Math.PI + Math.PI / 2, s = Math.sin(a), c = Math.cos(a);
  const w = Math.cos(2 * Math.PI * (ph - K.duty / 2));
  const drift = k => K.bodyDrift * wander(clock * 0.3, k);
  const pelvisYaw = K.pelvisTwist * s;
  const upper = -K.torsoTwist * s - pelvisYaw + 4 * drift(2);
  const roll = -K.hipDrop * Math.cos(2 * Math.PI * (ph - (K.duty - 0.45))) + 2 * drift(3);
  const swingSize = side => K.armSwing * (1 + K.armVar * (hash(Math.floor(legCycle(side)), 11) - 0.5));
  const arm = (side, f, df) => ({
    [`${side}_shoulder`]: [K.armBias + swingSize(side) * f, K.armSpread - K.armCross * f, 0],
    [`${side}_elbow`]: [K.elbowRest + K.elbowSwing * Math.max(0, f), 0, 0],
    [`${side}_wrist`]: [K.wristFlex - K.wristLag * df, 0, 0],
  });
  return {
    pelvis: [0, roll, pelvisYaw],
    spine: [K.lean + 3 * drift(1), -roll * K.counterLean + K.shoulderSway * w + K.bracing * 6 * pushRate(cycles), upper * K.spineShare],
    chest: [0, 0, upper * (1 - K.spineShare)],
    neck: [
      -K.lean * 0.6 + 0.3 * K.headLook * wander(clock * 0.2, 5),
      -(roll * (1 - K.counterLean) + K.shoulderSway * w) * K.headStab,
      K.torsoTwist * s * K.headStab + K.headLook * wander(clock * 0.15, 4),
    ],
    ...arm('r', -s, -c), ...arm('l', s, c),
    root: [-K.weightShift * w + pushX(cycles), K.bob * Math.cos(4 * Math.PI * (ph - K.duty / 2))],
  };
}

// Foot path per leg, u = leg phase. Stance [0, duty): pinned while the body passes over, then the heel peels
// by pivoting on the ball of the foot. Swing: lift peaks early, the foot lands a full stride ahead toe-up.
const smooth = v => v * v * (3 - 2 * v);
const BALL = 0.8;
function footPath(u) {
  const st = stride(), sd = st * K.duty, peelMax = K.toeRoll * D;
  if (u < K.duty) {
    const s = u / K.duty;
    const peel = peelMax * Math.max(0, (s - 0.55) / 0.45) ** 2;
    const strike = s < 0.15 ? K.heelStrike * (1 - s / 0.15) : 0;
    return {z: sd / 2 - st * u + BALL * (1 - Math.cos(peel)), lift: BALL * Math.sin(peel), swing: 0, stance: s, foot: strike - peel / D};
  }
  const v = (u - K.duty) / (1 - K.duty);
  const z0 = -sd / 2 + BALL * (1 - Math.cos(peelMax)), y0 = BALL * Math.sin(peelMax);
  const e = smooth(v);
  return {
    z: z0 + (sd / 2 - z0) * e,
    lift: y0 * (1 - v) + K.liftRatio * legLength() * Math.sin(Math.PI * v ** K.liftSkew),
    swing: v, stance: 1, foot: -K.toeRoll * (1 - e) + K.heelStrike * e,
  };
}
const legPhase = (side, ph) => (((side === 'r' ? ph : ph + 0.5) % 1) + 1) % 1;

// Stance knee profile (degrees): 5 at heel strike, rising to kneeLoad by 20% of stance, easing to kneeMid by 50%.
function stanceKnee(s) {
  if (s < 0.2) return 5 + (K.kneeLoad - 5) * Math.sin((Math.PI / 2) * (s / 0.2));
  if (s < 0.5) return K.kneeLoad + (K.kneeMid - K.kneeLoad) * (1 - Math.cos((Math.PI * (s - 0.2)) / 0.3)) / 2;
  return K.kneeMid;
}
const reachAt = kneeDeg => {
  const lt = THIGH * K.legLen, ls = SHIN * K.legLen;
  return Math.sqrt(lt * lt + ls * ls + 2 * lt * ls * Math.cos(kneeDeg * D));
};

// Hip height from the planted legs at their knee profile, plus the swing leg in its last quarter so the body
// drops into the next heel strike. The swing leg early in swing never holds the body down.
function ridingHipY(ph) {
  let hip = Infinity;
  for (const side of ['r', 'l']) {
    const f = footPath(legPhase(side, ph));
    if (f.swing > 0 && f.swing < 0.75) continue;
    const r = reachAt(f.swing > 0 ? 5 : stanceKnee(f.stance));
    hip = Math.min(hip, GROUND_ANKLE_Y + f.lift + Math.sqrt(Math.max(0, r * r - f.z * f.z)));
  }
  return hip;
}
function lowestHipY() {
  let lo = Infinity;
  for (let i = 0; i < 32; i++) lo = Math.min(lo, ridingHipY(i / 32));
  return lo;
}

const pelvisInv = new THREE.Matrix4();
// Two-bone IK in the pelvis frame: law of cosines for the knee, knee always bends forward.
function solveLeg(side, ph, bodyZ) {
  const f = footPath(legPhase(side, ph));
  const sgn = side === 'r' ? -1 : 1;
  const hipIdx = at[`${side}_hip`];
  const j = stepJitter(side);
  const target = new THREE.Vector3(sgn * (HIP_X + K.footOut + j.x), GROUND_ANKLE_Y + f.lift, bodyZ + f.z + j.z);
  const rel = target.applyMatrix4(pelvisInv).sub(base(hipIdx));
  const lt = THIGH * K.legLen, ls = SHIN * K.legLen;
  const dy = -rel.y, dz = rel.z;
  const d = Math.min(Math.hypot(dy, dz), (lt + ls) * 0.999);
  const knee = Math.PI - Math.acos((lt * lt + ls * ls - d * d) / (2 * lt * ls));
  const hip = Math.atan2(dz, dy) + Math.acos((lt * lt + d * d - ls * ls) / (2 * lt * d));
  const spread = Math.atan2(rel.x * sgn, dy);
  const hipDeg = hip / D, kneeDeg = -knee / D;
  return {
    [`${side}_hip`]: [hipDeg, spread / D, 0],
    [`${side}_knee`]: [kneeDeg, 0, 0],
    [`${side}_ankle`]: [-(hipDeg + kneeDeg) * K.footLevel + f.foot, 0, 0],
  };
}

const base = i => new THREE.Vector3().fromArray(RIG.joints[i].offset);
function applyPose(rots, ph, bodyZ) {
  RIG.joints.forEach((j, i) => {
    bones[i].quaternion.copy(localRot(j.name, showRest ? j.rest : (rots[j.name] ?? [0, 0, 0])));
    bones[i].position.copy(base(i));
    bones[i].scale.set(1, 1, 1);
  });
  if (showRest) return;
  bones[0].position.x += rots.root[0];
  const low = lowestHipY();
  bones[0].position.y += rots.root[1] + (low + (ridingHipY(ph) - low) * K.autoHeight) - HIP_Y;
  bones[0].position.z += bodyZ;
  bones[at.chest].position.y *= K.torsoLen;
  bones[at.head].scale.setScalar(K.headSize);
  for (const side of ['r', 'l']) {
    const sh = bones[at[`${side}_shoulder`]];
    sh.position.x *= K.shoulderWidth; sh.position.y -= K.shoulderDrop;
    sh.scale.y = K.armLen;
    bones[at[`${side}_hip`]].scale.y = K.legLen;
  }
  bones[0].updateMatrixWorld(true);
  pelvisInv.copy(bones[0].matrixWorld).invert();
  for (const side of ['r', 'l']) {
    for (const [name, r] of Object.entries(solveLeg(side, ph, bodyZ))) bones[at[name]].quaternion.copy(localRot(name, r));
  }
}

// Outline hull rebuilt on knob change: inflate along normals, plus optional per-vertex jitter for shards.
const hullKey = {};
function refreshHull(geo, part) {
  const tag = `${K.outline}:${K.shards}`;
  if (hullKey[geo.uuid] === tag) return;
  hullKey[geo.uuid] = tag;
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const push = K.outline + K.shards * Math.abs((Math.sin(i * 12.9898 + 78.233) * 43758.5453) % 1);
    p.setXYZ(i, part.pos[3*i] + part.nrm[3*i] * push, part.pos[3*i+1] + part.nrm[3*i+1] * push, part.pos[3*i+2] + part.nrm[3*i+2] * push);
  }
  p.needsUpdate = true;
}

let lastYaw = null;
function applyCamYaw() {
  if (K.camYaw === lastYaw) return;
  lastYaw = K.camYaw;
  const off = camera.position.clone().sub(controls.target);
  const flat = Math.hypot(off.x, off.z);
  off.x = Math.sin(K.camYaw * D) * flat; off.z = Math.cos(K.camYaw * D) * flat;
  camera.position.copy(controls.target).add(off);
}

function applyView() {
  applyCamYaw();
  refreshHull(bodyHull, RIG.body); refreshHull(skirtHull, RIG.skirt);
  for (const m of bodyMeshes) m.geometry.userData.morphNames.forEach((n, i) => { m.morphTargetInfluences[i] = K[n]; });
  skirtMats.forEach(m => { m.opacity = K.skirt; });
  skirtMeshes.forEach(m => { m.visible = K.skirt > 0.01; });
}

// ASCII: render the contour layer tiny, one pixel per cell; edge cells get a glyph from the mask gradient.
const rt = new THREE.WebGLRenderTarget(COLS, ROWS);
const px = new Uint8Array(COLS * ROWS * 4);
const pre = document.getElementById('ascii');
function ascii() {
  camera.layers.set(CONT);
  ground.visible = false;
  rCont.setRenderTarget(rt); rCont.render(scene, camera); rCont.setRenderTarget(null);
  ground.visible = true;
  rCont.readRenderTargetPixels(rt, 0, 0, COLS, ROWS, px);
  const idx = (x, y) => ((ROWS - 1 - y) * COLS + x) * 4;
  const ink = (x, y) => { const i = idx(x, y); return px[i] + px[i+1] + px[i+2] < 200; };
  const inside = (x, y) => {
    if (x < 0 || y < 0 || x >= COLS || y >= ROWS) return 0;
    const i = idx(x, y); return px[i+1] > 200 || ink(x, y) ? 1 : 0;
  };
  let out = '';
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      if (!inside(x, y)) { out += ' '; continue; }
      const gx = inside(x+1, y-1) + 2*inside(x+1, y) + inside(x+1, y+1) - inside(x-1, y-1) - 2*inside(x-1, y) - inside(x-1, y+1);
      const gy = inside(x-1, y+1) + 2*inside(x, y+1) + inside(x+1, y+1) - inside(x-1, y-1) - 2*inside(x, y-1) - inside(x+1, y-1);
      if (gx || gy) {
        const ax = Math.abs(gx), ay = Math.abs(gy);
        out += ax > 2*ay ? '|' : ay > 2*ax ? '-' : gx*gy > 0 ? '/' : '\\';
      } else out += ink(x, y) ? ':' : ' ';
    }
    out += '\n';
  }
  pre.textContent = out;
}

let last = performance.now();
function frame(t) {
  requestAnimationFrame(frame);
  const dt = Math.max(0, (t - last) / 1000); last = t;
  if (playing) { cycles += Math.min(dt, 0.1) * K.speed; phase = cycles % 1; } else { phase = K.phase; cycles = Math.floor(cycles) + phase; }
  const bodyZ = cycles * stride();
  const moved = bodyZ - (frame.z ?? bodyZ); frame.z = bodyZ;
  if (follow) { camera.position.z += moved; controls.target.z += moved; }
  ground.position.z = Math.round(bodyZ / 3) * 3;
  stepSweep(t);
  clock += Math.min(dt, 0.1);
  applyPose(walkRots(phase), phase, bodyZ);
  applyView();
  controls.update();
  camera.layers.set(WIRE); composer.render();
  camera.layers.set(CONT); rCont.render(scene, camera);
  ascii();
}
requestAnimationFrame(frame);
</script>
