<!doctype html><meta charset="utf-8"><title>maha skinned walk</title>
<style>
body{background:#1b1210;color:#f3d9c8;font-family:sans-serif;margin:12px}
#row{display:flex;gap:12px;align-items:flex-start;cursor:grab;user-select:none}
canvas{display:block}
pre{margin:0;width:480px;height:600px;background:#2a1a16;font:10px/10px Menlo,monospace;overflow:hidden;color:#ffd7b0}
button{background:#2a1a16;color:#f3d9c8;border:1px solid #6b2a1c;padding:4px 10px;margin:0 6px 8px 0;cursor:pointer}
button.on{background:#6b2a1c}
div#knobs{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:4px 18px;margin:10px 0;font-size:12px}
div#knobs label{display:grid;grid-template-columns:110px 1fr 44px;align-items:center;gap:6px}
div#knobs input{width:100%}
</style>
<div id="bar"></div>
<div id="knobs"></div>
<div id="row"><div id="wire"></div><div id="cont"></div><pre id="ascii"></pre></div>
<p>drag: orbit / scroll: zoom / right-drag: pan</p>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';

const RIG = __RIG__;
const W = 480, H = 600, COLS = 80, ROWS = 60, WIRE = 1, CONT = 2;

// Knobs: [key, label, min, max, step, default]. Angles in degrees.
const SPEC = [
  ['speed', 'cycles / sec', 0, 2, 0.01, 0.72],
  ['phase', 'phase (paused)', 0, 1, 0.001, 0],
  ['legSwing', 'leg swing', 0, 45, 0.5, 25.5],
  ['kneeBend', 'knee lift', 0, 90, 1, 34],
  ['plantKnee', 'plant knee', 0, 20, 0.5, 7],
  ['hipSpread', 'hip spread', -5, 15, 0.5, 3.5],
  ['pelvisTwist', 'pelvis twist', 0, 25, 0.5, 2.5],
  ['torsoTwist', 'torso twist', 0, 40, 0.5, 13],
  ['spineShare', 'twist in spine', 0, 1, 0.05, 0.7],
  ['lean', 'forward lean', -10, 20, 0.5, 0.5],
  ['headStab', 'head holds front', 0, 1, 0.05, 0.8],
  ['armSwing', 'arm swing', 0, 60, 0.5, 11],
  ['armCross', 'arm cross in', 0, 30, 0.5, 5.5],
  ['armSpread', 'arm spread', 0, 40, 0.5, 9.5],
  ['elbowRest', 'elbow rest', 0, 60, 0.5, 5.5],
  ['elbowSwing', 'elbow fwd bend', 0, 80, 0.5, 32.5],
  ['bob', 'bob', 0, 0.8, 0.01, 0],
  ['shoulderDrop', 'shoulder drop', -0.6, 0.8, 0.01, 0.25],
  ['shoulderIn', 'shoulder in', -0.4, 0.6, 0.01, 0],
];
// Knob state lives in the hash query (#?k=v&...): file:// refuses history writes, location.replace does not.
const K = {};
const hashParams = () => new URLSearchParams(location.hash.replace(/^#[^?]*\??/, ''));
const saved = hashParams();
let writeTimer = 0;
const persist = () => {
  clearTimeout(writeTimer);
  writeTimer = setTimeout(() => {
    const q = new URLSearchParams(SPEC.filter(([k, , , , , d]) => K[k] !== d).map(([k]) => [k, K[k]]));
    location.replace('#?' + q);
  }, 150);
};
const knobs = document.getElementById('knobs');
const inputs = {};
for (const [key, label, min, max, step, def] of SPEC) {
  K[key] = saved.has(key) ? +saved.get(key) : def;
  const l = document.createElement('label');
  const input = Object.assign(document.createElement('input'), {type: 'range', min, max, step, value: K[key]});
  const out = document.createElement('span'); out.textContent = K[key];
  input.oninput = () => { K[key] = +input.value; out.textContent = input.value; persist(); };
  inputs[key] = [input, out];
  l.append(label, input, out); knobs.appendChild(l);
}
function resetKnobs() {
  for (const [key, , , , , def] of SPEC) { K[key] = def; inputs[key][0].value = def; inputs[key][1].textContent = def; }
  persist();
}

const camera = new THREE.PerspectiveCamera(32, W / H, 0.1, 200);
camera.position.set(0, 9.8, 29);
const mk = (id, bg) => {
  const r = new THREE.WebGLRenderer({antialias: true});
  r.setPixelRatio(devicePixelRatio); r.setSize(W, H); r.setClearColor(bg);
  document.getElementById(id).appendChild(r.domElement); return r;
};
const rWire = mk('wire', 0x140b0a), rCont = mk('cont', 0xe9a890);
const controls = new OrbitControls(camera, document.getElementById('row'));
controls.target.set(0, 6.2, 0); controls.update();
const scene = new THREE.Scene();
const composer = new EffectComposer(rWire);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.8, 0.4, 0.05));

// Same rotation order as the Rust rig: Ry(yaw) * Rz(side * spread) * Rx(-pitch).
const X = new THREE.Vector3(1, 0, 0), Y = new THREE.Vector3(0, 1, 0), Z = new THREE.Vector3(0, 0, 1), D = Math.PI / 180;
const qa = (axis, deg) => new THREE.Quaternion().setFromAxisAngle(axis, deg * D);
function localRot(name, [pitch, spread, yaw]) {
  const side = name.startsWith('r_') ? -1 : 1;
  return qa(Y, yaw).multiply(qa(Z, side * spread)).multiply(qa(X, -pitch));
}

const bones = RIG.joints.map(j => {
  const b = new THREE.Bone(); b.name = j.name;
  b.position.fromArray(j.offset); b.quaternion.copy(localRot(j.name, j.rest)); return b;
});
RIG.joints.forEach((j, i) => { if (j.parent >= 0) bones[j.parent].add(bones[i]); });
const byName = Object.fromEntries(RIG.joints.map((j, i) => [j.name, i]));
const skeleton = new THREE.Skeleton(bones);

// Surface nets winding is not guaranteed; flip triangles whose face normal disagrees with the SDF gradient.
function orient(idx, P, N) {
  idx = idx.slice();
  const v = i => new THREE.Vector3(P[3*i], P[3*i+1], P[3*i+2]);
  let votes = 0;
  for (let t = 0; t < idx.length; t += 3) {
    const [a, b, c] = [idx[t], idx[t+1], idx[t+2]];
    const f = v(b).sub(v(a)).cross(v(c).sub(v(a)));
    votes += Math.sign(f.x*N[3*a] + f.y*N[3*a+1] + f.z*N[3*a+2]);
  }
  if (votes < 0) for (let t = 0; t < idx.length; t += 3) [idx[t+1], idx[t+2]] = [idx[t+2], idx[t+1]];
  return idx;
}
const idx = orient(RIG.idx, RIG.pos, RIG.nrm);
function skinnedGeo(pos) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pos), 3));
  g.setAttribute('normal', new THREE.BufferAttribute(new Float32Array(RIG.nrm), 3));
  g.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(RIG.skinIndex, 4));
  g.setAttribute('skinWeight', new THREE.Float32BufferAttribute(RIG.skinWeight, 4));
  const col = new Float32Array(RIG.kind.length * 3);
  RIG.kind.forEach((k, i) => col.set(k ? [0.5, 0.72, 0.65] : [1.0, 0.78, 0.6], 3 * i));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.setIndex(idx); return g;
}
const geo = skinnedGeo(RIG.pos);
const hullPos = RIG.pos.map((p, i) => p + RIG.nrm[i] * 0.07);
const hullGeo = skinnedGeo(hullPos);

let first = null;
function skinned(g, material, layer) {
  const m = new THREE.SkinnedMesh(g, material);
  m.frustumCulled = false;
  if (!first) { first = m; m.add(bones[0]); m.bind(skeleton); } else m.bind(skeleton, first.bindMatrix);
  m.layers.set(layer); scene.add(m); return m;
}
skinned(geo, new THREE.MeshBasicMaterial({color: 0x140b0a, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1}), WIRE);
skinned(geo, new THREE.MeshBasicMaterial({vertexColors: true, wireframe: true}), WIRE);
skinned(geo, new THREE.MeshBasicMaterial({vertexColors: true, wireframe: true, transparent: true, opacity: 0.07, depthTest: false}), WIRE);
skinned(geo, new THREE.MeshBasicMaterial({color: 0xfbf1e8, side: THREE.DoubleSide}), CONT);
skinned(hullGeo, new THREE.MeshBasicMaterial({color: 0x3a140e, side: THREE.BackSide}), CONT);

// Wheel and blade ride their bones: convert bind-pose world points into bone-local space.
scene.updateMatrixWorld(true);
for (const l of RIG.lines) {
  const bone = bones[l.bone];
  const pts = l.pts.map(q => bone.worldToLocal(new THREE.Vector3(...q)));
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({color: l.kind === 'wheel' ? 0xf0b848 : 0xdfe8f0}));
  line.layers.enable(WIRE); line.layers.enable(CONT); bone.add(line);
}

let playing = true, phase = 0;
const bar = document.getElementById('bar');
const play = document.createElement('button'); play.textContent = 'walk'; play.classList.add('on'); bar.appendChild(play);
play.onclick = () => { playing = !playing; play.classList.toggle('on', playing); };
const restBtn = document.createElement('button'); restBtn.textContent = 'bind pose'; bar.appendChild(restBtn);
let showRest = false;
const resetBtn = document.createElement('button'); resetBtn.textContent = 'reset knobs'; bar.appendChild(resetBtn);
resetBtn.onclick = resetKnobs;
restBtn.onclick = () => { showRest = !showRest; restBtn.classList.toggle('on', showRest); };

// Procedural walk. s = sin(phase): right leg forward at s = 1. Arms swing against their legs and
// cross toward the midline on the forward swing; chest counter-twists the pelvis about the body axis.
function walkRots(ph) {
  const a = ph * 2 * Math.PI, s = Math.sin(a), c = Math.cos(a);
  const pelvisYaw = K.pelvisTwist * s;
  const upper = -K.torsoTwist * s - pelvisYaw;
  const arm = side => {
    const f = side === 'r' ? -s : s;
    return {
      [`${side}_shoulder`]: [K.armSwing * f, K.armSpread - K.armCross * f, 0],
      [`${side}_elbow`]: [K.elbowRest + K.elbowSwing * Math.max(0, f), 0, 0],
    };
  };
  return {
    pelvis: [0, 0, pelvisYaw],
    spine: [K.lean, 0, upper * K.spineShare],
    chest: [0, 0, upper * (1 - K.spineShare)],
    neck: [-K.lean * 0.6, 0, K.torsoTwist * s * K.headStab],
    r_hip: [K.legSwing * s, K.hipSpread, 0],
    l_hip: [-K.legSwing * s, K.hipSpread, 0],
    r_knee: [-(K.plantKnee + K.kneeBend * Math.max(0, c) ** 2), 0, 0],
    l_knee: [-(K.plantKnee + K.kneeBend * Math.max(0, -c) ** 2), 0, 0],
    ...arm('r'), ...arm('l'),
    bob: K.bob * Math.cos(2 * a),
  };
}

function applyPose(rots) {
  RIG.joints.forEach((j, i) => {
    const r = showRest ? j.rest : (rots[j.name] ?? [0, 0, 0]);
    bones[i].quaternion.copy(localRot(j.name, r));
  });
  bones[0].position.fromArray(RIG.joints[0].offset);
  for (const side of ['r', 'l']) {
    const i = byName[`${side}_shoulder`], b = bones[i];
    b.position.fromArray(RIG.joints[i].offset);
    if (!showRest) { b.position.y -= K.shoulderDrop; b.position.x *= 1 - K.shoulderIn / Math.abs(b.position.x); }
  }
  if (!showRest) bones[0].position.y += rots.bob;
}

// ASCII: render the contour layer tiny, one pixel per cell; edge cells get a glyph from the mask gradient.
const rt = new THREE.WebGLRenderTarget(COLS, ROWS);
const px = new Uint8Array(COLS * ROWS * 4);
const pre = document.getElementById('ascii');
function ascii() {
  camera.layers.set(CONT);
  rCont.setRenderTarget(rt); rCont.render(scene, camera); rCont.setRenderTarget(null);
  rCont.readRenderTargetPixels(rt, 0, 0, COLS, ROWS, px);
  const at = (x, y) => ((ROWS - 1 - y) * COLS + x) * 4;
  const ink = (x, y) => { const i = at(x, y); return px[i] + px[i+1] + px[i+2] < 200; };
  const inside = (x, y) => {
    if (x < 0 || y < 0 || x >= COLS || y >= ROWS) return 0;
    const i = at(x, y); return px[i+1] > 200 || ink(x, y) ? 1 : 0;
  };
  let out = '';
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      if (!inside(x, y)) { out += ' '; continue; }
      const gx = inside(x+1, y-1) + 2*inside(x+1, y) + inside(x+1, y+1) - inside(x-1, y-1) - 2*inside(x-1, y) - inside(x-1, y+1);
      const gy = inside(x-1, y+1) + 2*inside(x, y+1) + inside(x+1, y+1) - inside(x-1, y-1) - 2*inside(x, y-1) - inside(x+1, y-1);
      if (gx || gy) {
        const ax = Math.abs(gx), ay = Math.abs(gy);
        out += ax > 2*ay ? '|' : ay > 2*ax ? '-' : gx*gy > 0 ? '/' : '\\';
      } else out += ink(x, y) ? ':' : ' ';
    }
    out += '\n';
  }
  pre.textContent = out;
}

let last = performance.now();
function frame(t) {
  requestAnimationFrame(frame);
  const dt = (t - last) / 1000; last = t;
  phase = playing ? (phase + dt * K.speed) % 1 : K.phase;
  applyPose(walkRots(phase));
  controls.update();
  camera.layers.set(WIRE); composer.render();
  camera.layers.set(CONT); rCont.render(scene, camera);
  ascii();
}
requestAnimationFrame(frame);
</script>
